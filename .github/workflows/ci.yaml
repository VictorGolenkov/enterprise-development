name: .NET CI

on:
  push:
    branches: [ "lab1" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ./BeautySalon.slnx

    - name: Build
      run: dotnet build ./BeautySalon.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test --solution ./BeautySalon.slnx --no-build --configuration Release